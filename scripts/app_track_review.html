<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#fbfaf7; --fg:#2b2a26; --muted:#77736a; --accent:#1f6f8b; --border:#e3dfd6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font:14px/1.4 -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  [hidden] { display:none !important; }
  #app { display:flex; height:100%; }
  #side { width:360px; display:flex; flex-direction:column; border-right:1px solid var(--border); min-height:0; }
  #head { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
  h1 { font-size:18px; margin:0 0 2px; }
  .hint { color:var(--muted); margin:0; font-size:12px; }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font:inherit; background:#fff; color:var(--fg); }
  button { padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; font:inherit; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { background:#b3261e; color:#fff; border-color:#b3261e; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .row > * { flex:1; min-width:0; }
  #list { flex:1; overflow-y:auto; list-style:none; margin:0; padding:0; min-height:0; }
  #list h2 { font-size:12px; letter-spacing:.06em; color:var(--muted); margin:0; padding:10px 16px 4px; position:sticky; top:0; background:var(--bg); }
  #list button { display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:baseline; width:100%; padding:6px 16px; border:0; border-radius:0; background:none; text-align:left; }
  #list button:hover { background:#f2efe8; }
  #list button.active { background:#dcebf0; }
  #list button.removed span { text-decoration:line-through; color:var(--muted); }
  #list i { width:10px; height:10px; border-radius:50%; background:var(--c); align-self:center; }
  #list small { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #list em { display:block; font-style:normal; font-size:12px; color:#9a5b00; }
  #card { padding:12px 16px; border-top:1px solid var(--border); }
  #card label { display:block; font-size:12px; font-weight:600; margin-bottom:2px; }
  #map { flex:1; min-width:0; }
  @media (max-width:700px) { #app { flex-direction:column-reverse; } #side { width:100%; height:55%; border-right:0; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="head">
      <h1>/*TITLE*/</h1>
      <p class="hint" id="summary" aria-live="polite"></p>
      <div class="row">
        <input id="search" type="search" placeholder="Search names" aria-label="Search names">
        <select id="show" aria-label="Show">
          <option value="all">All tracks</option>
          <option value="look">Needs a look</option>
          <option value="kept">Kept</option>
          <option value="removed">Removed</option>
        </select>
      </div>
      <div class="row"><button type="button" id="download" class="primary">Download kept tracks for import</button></div>
      <p class="hint" style="margin-top:6px">Up and down arrows move through the list. X removes or restores a track.</p>
    </div>
    <ul id="list"></ul>
    <form id="card" hidden>
      <label for="cName">Name</label>
      <input id="cName">
      <div class="row">
        <div><label for="cDate">Date</label><input id="cDate" type="date"></div>
        <div><label for="cType">Type</label><select id="cType"></select></div>
      </div>
      <label for="cNotes" style="margin-top:8px">Notes</label>
      <textarea id="cNotes" rows="2"></textarea>
      <p class="hint" id="cMeta" style="margin-top:6px"></p>
      <div class="row"><button type="button" id="cRemove"></button></div>
    </form>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script id="data" type="application/json">/*TRACKS*/</script>
<script>
// Choices stay keyed to each track's id in this browser, so rebuilding the page doesn't lose them.
const SAVE_KEY = "adventuremap.appTrackReview./*KEY*/";
const TYPES = { Walk: "#00897B", Hike: "#2E7D32", Run: "#D81B60", Ride: "#3949AB", Sail: "#0288D1", Other: "#546E7A" };
const $ = (id) => document.getElementById(id);
const tracks = JSON.parse($("data").textContent);
let edits = {};
try { edits = JSON.parse(localStorage.getItem(SAVE_KEY)) ?? {}; } catch {}
let selectedId = null;

const view = (t) => ({ ...t, ...edits[t.id] });
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(edits)); } catch {} };
const edit = (id, change) => { edits[id] = { ...edits[id], ...change }; save(); };

function reasons(t) {
  const out = [];
  if (t.name === "Unnamed track") out.push("no name");
  if (!t.date) out.push("no date");
  if (!TYPES[t.sportType] || t.sportType === "Other") out.push("no type");
  return out;
}

function shown() {
  const q = $("search").value.trim().toLowerCase();
  const filter = $("show").value;
  return tracks.map(view).filter((t) => {
    if (q && !t.name.toLowerCase().includes(q)) return false;
    if (filter === "removed") return t.removed;
    if (filter === "kept") return !t.removed;
    if (filter === "look") return !t.removed && reasons(t).length > 0;
    return true;
  }).sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || a.name.localeCompare(b.name));
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  let year = null;
  for (const t of shown()) {
    const y = t.date ? t.date.slice(0, 4) : "No date";
    if (y !== year) {
      year = y;
      const h = document.createElement("h2");
      h.textContent = y;
      list.append(h);
    }
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.id = t.id;
    b.className = (t.id === selectedId ? "active " : "") + (t.removed ? "removed" : "");
    b.style.setProperty("--c", TYPES[t.sportType] ?? TYPES.Other);
    const name = document.createElement("span");
    name.textContent = t.name;
    const why = reasons(t);
    if (why.length) {
      const note = document.createElement("em");
      note.textContent = why.join(", ");
      name.append(note);
    }
    const km = document.createElement("small");
    km.textContent = `${t.km < 10 ? t.km.toFixed(1) : Math.round(t.km)} km`;
    b.append(document.createElement("i"), name, km);
    b.onclick = () => select(t.id, true);
    li.append(b);
    list.append(li);
  }
  const removed = tracks.filter((t) => view(t).removed).length;
  $("summary").textContent = `${tracks.length - removed} kept, ${removed} removed, from ${tracks.length} tracks`;
}

function renderCard() {
  const raw = tracks.find((t) => t.id === selectedId);
  $("card").hidden = !raw;
  if (!raw) return;
  const t = view(raw);
  $("cName").value = t.name;
  $("cDate").value = t.date ?? "";
  $("cType").value = TYPES[t.sportType] ? t.sportType : "Other";
  $("cNotes").value = t.notes ?? "";
  $("cMeta").textContent = `${t.km} km${t.movingTime ? `, ${Math.round(t.movingTime / 60)} min moving` : ""}. From ${t.file ?? "an import file"}`;
  $("cRemove").textContent = t.removed ? "Restore track" : "Remove track";
  $("cRemove").className = t.removed ? "" : "danger";
}

const feature = (t) => ({ type: "Feature", properties: { id: t.id, color: TYPES[t.sportType] ?? TYPES.Other },
  geometry: { type: "MultiLineString", coordinates: t.segments } });

function drawSelected() {
  const picked = tracks.find((t) => t.id === selectedId);
  map.getSource("selected")?.setData({ type: "FeatureCollection", features: picked ? [feature(picked)] : [] });
}

function drawTracks() {
  const visible = tracks.map(view).filter((t) => !t.removed);
  map.getSource("tracks")?.setData({ type: "FeatureCollection", features: visible.map(feature) });
  drawSelected();
}

function fit(t) {
  const pts = t.segments.flat();
  const lons = pts.map((p) => p[0]);
  const lats = pts.map((p) => p[1]);
  map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 60, maxZoom: 15, duration: 500 });
}

function select(id, move) {
  selectedId = id;
  document.querySelector("#list button.active")?.classList.remove("active");
  const row = document.querySelector(`#list button[data-id="${id}"]`);
  row?.classList.add("active");
  row?.scrollIntoView({ block: "nearest" });
  renderCard();
  drawSelected();
  const t = tracks.find((x) => x.id === id);
  if (move && t) fit(t);
}

function toggleRemoved() {
  if (!selectedId) return;
  const t = view(tracks.find((x) => x.id === selectedId));
  edit(selectedId, { removed: !t.removed });
  renderList(); renderCard(); drawTracks();
}

function step(by) {
  const ids = shown().map((t) => t.id);
  if (!ids.length) return;
  const i = ids.indexOf(selectedId);
  select(ids[Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : i + by))], true);
}

const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [-40, 40], zoom: 2 });
map.addControl(new maplibregl.NavigationControl());
map.on("load", () => {
  const empty = { type: "FeatureCollection", features: [] };
  map.addSource("tracks", { type: "geojson", data: empty });
  map.addSource("selected", { type: "geojson", data: empty });
  map.addLayer({ id: "tracks", type: "line", source: "tracks", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": ["get", "color"], "line-opacity": 0.65, "line-width": ["interpolate", ["linear"], ["zoom"], 5, 1.5, 14, 3] } });
  map.addLayer({ id: "selected-edge", type: "line", source: "selected", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#fff", "line-width": 8 } });
  map.addLayer({ id: "selected", type: "line", source: "selected", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#E65100", "line-width": 4 } });
  drawTracks();
});
map.on("click", (e) => {
  const box = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
  const hit = map.queryRenderedFeatures(box, { layers: ["tracks"] })[0];
  if (hit) select(hit.properties.id, false);
});
map.on("mousemove", (e) => {
  const box = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
  map.getCanvas().style.cursor = map.getLayer("tracks") && map.queryRenderedFeatures(box, { layers: ["tracks"] }).length ? "pointer" : "";
});

$("cType").append(...Object.keys(TYPES).map((k) => new Option(k, k)));
$("search").oninput = renderList;
$("show").onchange = renderList;
$("cName").onchange = (e) => { edit(selectedId, { name: e.target.value.trim() || "Unnamed track" }); renderList(); };
$("cDate").onchange = (e) => { edit(selectedId, { date: e.target.value }); renderList(); };
$("cNotes").onchange = (e) => { edit(selectedId, { notes: e.target.value.trim() }); };
$("cType").onchange = (e) => { edit(selectedId, { sportType: e.target.value }); renderList(); drawTracks(); };
$("cRemove").onclick = toggleRemoved;
$("card").onsubmit = (e) => e.preventDefault();
$("download").onclick = () => {
  const kept = tracks.map(view).filter((t) => !t.removed)
    .map(({ removed, segments, km, file, notes, ...t }) => (notes ? { ...t, notes } : t));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ tracks: kept })], { type: "application/json" }));
  a.download = "/*OUT*/";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key.toLowerCase() === "x") toggleRemoved();
});
renderList();
</script>
</body>
</html>
